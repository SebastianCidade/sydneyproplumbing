<!DOCTYPE html>
<html>
<head>
  <title>Sydney Pro Plumbing</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #chat {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 25px;
      min-height: 150px;
      max-height: 500px;
      overflow-y: auto;
    }

    .message {
      margin: 10px 0;
    }

    .customer {
      font-weight: bold;
    }

    .ai {
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Sydney Pro Plumbing</h1>
<h2>AI Receptionist</h2>

<p>Hi! How can we help with your plumbing today?</p>
<p>Need a plumber? Chat with our receptionist below.</p>

<div id="chat">
  <div class="message">
    <strong class="ai">AI Receptionist:</strong>
    Hi! How can I help with your plumbing today?
  </div>
</div>

<input
  id="message"
  type="text"
  placeholder="Type your message..."
  onkeydown="if(event.key === 'Enter') sendMessage()"
>

<button type="button" onclick="sendMessage()">Send</button>

<form action="https://formsubmit.co/bastiancidade@gmail.com" method="POST">

  <input type="text" name="Name" placeholder="Your name" required>

  <input type="tel" name="Phone" placeholder="Phone number" required>

  <input type="text" name="Suburb" placeholder="Suburb" required>

  <input
    type="text"
    name="Plumbing job"
    placeholder="What plumbing work do you need?"
    required
  >

  <button type="submit">Request a call</button>

</form>

<script>
let messages = [];

async function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if (!message) return;

  chat.innerHTML += `
    <div class="message">
      <strong class="customer">You:</strong> ${escapeHtml(message)}
    </div>
  `;

  messages.push({
    role: "user",
    content: message
  });

  input.value = "";

  const loading = document.createElement("div");
  loading.className = "message";
  loading.id = "loading";
  loading.innerHTML =
    "<strong class='ai'>AI Receptionist:</strong> Thinking...";
  chat.appendChild(loading);

  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    const data = await response.json();

    document.getElementById("loading").remove();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    const reply = data.reply || "Sorry, I couldn't respond.";

    messages.push({
      role: "assistant",
      content: reply
    });

    chat.innerHTML += `
      <div class="message">
        <strong class="ai">AI Receptionist:</strong>
        ${escapeHtml(reply)}
      </div>
    `;

    chat.scrollTop = chat.scrollHeight;

  } catch (error) {
    document.getElementById("loading")?.remove();

    chat.innerHTML += `
      <div class="message">
        <strong class="ai">AI Receptionist:</strong>
        Sorry, I'm having trouble connecting right now. Please use the form below to request a call.
      </div>
    `;

    console.error(error);
  }
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
</script>

</body>
</html>
