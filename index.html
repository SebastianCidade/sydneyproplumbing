<!DOCTYPE html>
<html>
<head>
<title>Sydney Pro Plumbing</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  box-sizing: border-box;
}

button {
  cursor: pointer;
}

#chat {
  border: 1px solid #ddd;
  padding: 15px;
  margin-top: 25px;
  min-height: 150px;
}

.message {
  margin: 10px 0;
}
</style>
</head>

<body>

<h1>Sydney Pro Plumbing</h1>

<p>Need a plumber? Chat with our receptionist below.</p>

<div id="chat">
  <div class="message">
    <strong>AI Receptionist:</strong>
    Hi! How can we help with your plumbing today?
  </div>
</div>

<input id="message" placeholder="Type your message...">

<button onclick="sendMessage()">Send</button>

<script>
function sendMessage() {

  const input = document.getElementById("message");
  const chat = document.getElementById("chat");

  if (input.value.trim() === "") return;

  chat.innerHTML +=
    "<div class='message'><strong>You:</strong> " +
    input.value +
    "</div>";

  chat.innerHTML +=
    "<div class='message'><strong>AI Receptionist:</strong> Thanks! I'll collect your details and help arrange a call from the plumber.</div>";

  input.value = "";
}
</script>

</body>
</html>
